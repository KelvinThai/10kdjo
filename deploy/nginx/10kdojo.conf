# /etc/nginx/sites-available/10kdojo.conf
# Symlink into /etc/nginx/sites-enabled/ to enable.
# Both server blocks are managed here; certbot will inject SSL
# directives into the :443 block on first run.

# HTTP server — Let's Encrypt challenge + redirect to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 10kdojo.org www.10kdojo.org;

    # certbot webroot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — proxies to the Next.js container on 127.0.0.1:3000.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 10kdojo.org www.10kdojo.org;

    # SSL — paths populated by certbot --nginx on first run
    ssl_certificate /etc/letsencrypt/live/10kdojo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/10kdojo.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PDF certificates can be a few hundred KB; allow comfortable upload too.
    client_max_body_size 10M;

    # Gzip text responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
