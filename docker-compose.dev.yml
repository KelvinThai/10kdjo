services:
  postgres:
    image: postgres:16-alpine
    container_name: 10kdjo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: 10kdjo
      POSTGRES_PASSWORD: 10kdjo_dev
      POSTGRES_DB: 10kdjo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 10kdjo -d 10kdjo"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: 10kdjo-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
