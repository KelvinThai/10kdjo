services:
  postgres:
    image: postgres:16-alpine
    container_name: 10kdjo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-10kdjo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-10kdjo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-10kdjo} -d ${POSTGRES_DB:-10kdjo}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port mapping — only reachable on the docker network.

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: 10kdjo-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind to loopback only — system nginx terminates TLS and proxies
      # to 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
    name: 10kdjo-postgres-data
